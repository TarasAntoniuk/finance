name: Docker Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Docker info
        run: docker info

      - name: Run single integration test
        run: mvn test -Dtest=BankRepositoryTest#save_ShouldPersistBankWithAllFields -Dsurefire.failIfNoSpecifiedTests=false