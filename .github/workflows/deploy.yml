name: Test SSH Connection

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Decode SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/github_deploy_key
          chmod 600 ~/.ssh/github_deploy_key

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/github_deploy_key \
            -p $SERVER_SSH_PORT \
            $SERVER_USER@$SERVER_HOST "echo '✅ SSH connection successful!'"
