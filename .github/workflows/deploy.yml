name: Deploy to Server

on:
  push:
    branches:
      - main  # або master, залежно від вашої гілки
  workflow_dispatch:  # можливість запуску вручну

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Create SSH config
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SERVER_HOST
            User $SERVER_USER
            Port $SERVER_SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy application
        run: |
          ssh server << 'ENDSSH'
            set -e
          
            # Перейти в директорію проєкту
            cd /path/to/your/project
          
            # Оновити код
            git pull origin main
          
            # Встановити залежності (приклад для Node.js)
            npm install --production
          
            # Перезапустити додаток (приклад для PM2)
            pm2 restart your-app-name
          
            echo "✅ Deployment completed successfully!"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh server "curl -f http://localhost:3000/health || echo '⚠️  Health check failed'"