name: Test SSH Connection

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Shows info
      - name: Debug variables
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          echo "Server host: $SERVER_HOST"
          echo "Server user: $SERVER_USER"
          echo "Server port: $SERVER_SSH_PORT"

      # 2. Decode
      - name: Decode SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/github_deploy_key
          chmod 600 ~/.ssh/github_deploy_key

      # 3. Test
      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/github_deploy_key \
              -p $SERVER_SSH_PORT \
              $SERVER_USER@$SERVER_HOST "echo '✅ SSH connection successful!'"