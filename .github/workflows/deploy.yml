name: CI/CD Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Run tests
        run: mvn clean test -Dspring.profiles.active=test

      - name: Package JAR
        run: |
          mvn clean package -DskipTests
          echo "📦 Built artifact:"
          ls -lh target/*.jar

      - name: Setup SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Clean up old Docker resources
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            echo "🧹 Cleaning old Docker resources..."
          
            # Clean Docker
            docker image prune -a -f || true
            docker container prune -f || true
          
            # Remove old finance-core if exists
            sudo rm -rf /srv/apps/finance-core 2>/dev/null || true
          
            echo "✅ Cleanup completed"
            df -h | grep /dev/vda3
          ENDSSH

      - name: Prepare deployment directories
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            APP_DIR=/srv/apps/finance
            sudo mkdir -p $APP_DIR/docker/{app,nginx,db_data} $APP_DIR/{logs,certs,certs/webroot}
            sudo chown -R deploy:deploy $APP_DIR
            echo "✅ Directories ready"
          ENDSSH

      - name: Fix permissions for SSL certificates
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /srv/apps/finance/docker
          
            # Ensure proper ownership and permissions
            sudo chown -R deploy:deploy certs/ logs/ 2>/dev/null || true
            sudo chmod -R 755 certs/ 2>/dev/null || true
          
            echo "✅ Permissions configured"
          ENDSSH

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Copy JAR to server
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }}" \
            target/*.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/apps/finance/docker/app/app.jar

      - name: Copy Docker files
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }}" \
            docker/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/apps/finance/docker/

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /srv/apps/finance/docker
          
            echo "🔄 Stopping old containers..."
            docker compose down --remove-orphans || true
          
            echo "🚀 Starting all services..."
            docker compose up -d --build
          
            echo "✅ Deployment completed"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
          
            echo "📦 Running containers:"
            docker ps
          
            echo ""
            echo "🏥 Health check (with retry)..."
            SUCCESS=false
            for i in {1..30}; do
              if curl -f http://localhost:8080/actuator/health 2>/dev/null; then
                echo ""
                echo "✅ Application is healthy!"
                SUCCESS=true
                break
              fi
              echo "⏳ Attempt $i/30 - waiting for application..."
              sleep 2
            done
          
            if [ "$SUCCESS" = true ]; then
              exit 0
            else
              echo ""
              echo "❌ Health check failed after 60 seconds"
              echo "📋 Application logs:"
              docker logs finance-app --tail 50
              exit 1
            fi
          ENDSSH

      - name: Deployment summary
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to production completed successfully!"
            echo "🌐 API: https://api.tarasantoniuk.com"
            echo "📚 Docs: https://api.tarasantoniuk.com/swagger-ui/index.html"
          else
            echo "❌ Deployment failed! Check logs above."
          fi