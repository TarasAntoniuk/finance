name: CI/CD Deploy (new)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: mvn clean test -Dspring.profiles.active=test

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Package JAR
        run: mvn clean package -DskipTests

      - name: Setup SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Prepare deployment directories
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            APP_DIR=/srv/apps/finance-core
            sudo mkdir -p $APP_DIR/docker/{app,nginx,db_data} $APP_DIR/{logs,certs,certs/webroot}
            sudo chown -R deploy:deploy $APP_DIR
            echo "✅ Directories ready"
          ENDSSH

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Copy JAR to server
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }}" \
            target/*.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/apps/finance-core/docker/app/app.jar

      - name: Copy Docker files
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }}" \
            docker/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/apps/finance-core/docker/

      - name: Deploy with Docker Compose (HTTP only)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /srv/apps/finance-core/docker
            docker compose down --remove-orphans || true
            docker rm -f finance-core-app finance-core-nginx finance-core-certbot finance-core-db 2>/dev/null || true
            # Запускаємо Nginx і app без SSL, щоб Certbot зміг пройти HTTP challenge
            docker compose up -d --build app nginx
            echo "✅ App + Nginx (HTTP) up for Certbot"
          ENDSSH

      - name: Deploy and setup SSL
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /srv/apps/finance-core/docker

            # Перевірити чи існують сертифікати
            if [ ! -d "./certs/live/api.tarasantoniuk.com" ]; then
              echo "🔐 Setting up SSL certificates for the first time..."
              bash init-letsencrypt.sh
            else
              echo "✅ SSL certificates already exist, skipping initialization"
            fi

            # Запустити або перезапустити сервіси
            docker compose up -d

            echo "🚀 Deployment completed"
          ENDSSH

      - name: Restart Nginx with HTTPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /srv/apps/finance-core/docker
            docker compose up -d --build nginx
            echo "✅ Nginx restarted with SSL"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            sleep 10
            echo "📦 Containers:"
            docker ps
            echo ""
            echo "🏥 Health check:"
            curl -f http://localhost:8080/actuator/health || echo "⚠️ Health check failed"
          ENDSSH
