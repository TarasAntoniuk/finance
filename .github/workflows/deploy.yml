name: CI/CD Deploy NEW

on:
  push:
    branches:
      - stable
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        # Підключаємо env файл
        env_file:
          - .env
        env:
          POSTGRES_DB: finance_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

#      - name: Run tests with coverage
#        run: mvn clean verify -P test-coverage

      - name: Package JAR
        run: mvn clean package -DskipTests

      - name: Setup SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Create SSH config
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SERVER_HOST
            User $SERVER_USER
            Port $SERVER_SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Prepare deployment directories
        run: |
          ssh server << 'ENDSSH'
            set -e
            APP_DIR=/srv/apps/finance-core

            sudo mkdir -p $APP_DIR/{docker/app,logs,db_data,certs}
            sudo chown -R deploy:deploy $APP_DIR
            echo "✅ Directories prepared"
          ENDSSH


      - name: Copy JAR file to server
        run: |
          scp target/*.jar server:/srv/apps/finance-core/docker/app/app.jar

      - name: Copy Docker files to server
        run: |
          scp -r docker/* server:/srv/apps/finance-core/docker/

      - name: Deploy with Docker Compose
        run: |
          ssh server << 'ENDSSH'
            set -e
            cd /srv/apps/finance-core

            if [ -d ".git" ]; then
              git fetch --all
              git reset --hard origin/stable
            fi

            cd docker
            docker compose down
            docker compose up -d --build

            echo "✅ Deployment completed!"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh server << 'ENDSSH'
            set -e
            sleep 10

            echo "📦 Running containers:"
            docker ps

            echo ""
            echo "🔍 Checking finance-core container:"
            docker ps | grep finance-core || echo "⚠️  Container not running"

            # Health check (якщо є endpoint)
            echo ""
            echo "🏥 Health check:"
            curl -f http://localhost:8080/actuator/health || echo "⚠️  Health check failed"
          ENDSSH
