name: CI/CD Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Run tests
        run: mvn clean test -Dspring.profiles.active=test

      - name: Package JAR
        run: |
          mvn clean package -DskipTests
          echo "📦 Built artifact:"
          ls -lh target/*.jar

      - name: Setup SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Prepare deployment directories
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            APP_DIR=/srv/apps/finance
            sudo mkdir -p $APP_DIR/docker/app
            sudo chown -R deploy:deploy $APP_DIR
            echo "✅ Directories ready"
          ENDSSH

      - name: Ensure .env exists
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /srv/apps/finance/docker
          
            if [ ! -f .env ]; then
              echo "❌ ERROR: .env file not found!"
              echo "Please create .env with FINANCE_DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS, GOOGLE_CLIENT_ID"
              exit 1
            fi

            for key in FINANCE_DB_PASSWORD JWT_SECRET CORS_ALLOWED_ORIGINS GOOGLE_CLIENT_ID; do
              if ! grep -q "^${key}=" .env; then
                echo "❌ ERROR: ${key} is missing from .env"
                exit 1
              fi
            done

            echo "✅ .env file exists and has required keys"
          ENDSSH

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Copy JAR to server
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }}" \
            target/*.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/apps/finance/docker/app/app.jar

      - name: Copy Docker files
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }}" \
            --exclude='certs' \
            --exclude='logs' \
            --exclude='webroot' \
            --exclude='data' \
            --exclude='.env' \
            docker/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/srv/apps/finance/docker/

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /srv/apps/finance/docker
          
            echo "🔄 Stopping old container..."
            docker compose down || true
          
            echo "🚀 Starting finance-app..."
            docker compose up -d --build
          
            echo "✅ Deployment completed"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          
            echo "📦 Running containers:"
            docker ps | grep -E "finance-app|shared-postgres|shared-nginx"
          
            echo ""
            echo "🌐 Network status:"
            docker network inspect app-network --format '{{range .Containers}}{{.Name}} {{end}}'
          
            echo ""
            echo "🏥 Health check (with retry)..."
            SUCCESS=false
            for i in {1..30}; do
              if curl -f http://localhost:8080/actuator/health 2>/dev/null; then
                echo ""
                echo "✅ Application is healthy!"
                SUCCESS=true
                break
              fi
              echo "⏳ Attempt $i/30 - waiting for application..."
              sleep 2
            done
          
            if [ "$SUCCESS" = true ]; then
              exit 0
            else
              echo ""
              echo "❌ Health check failed after 60 seconds"
              echo "📋 Application logs:"
              docker logs finance-app --tail 50
              exit 1
            fi
          ENDSSH

      - name: Deployment summary
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to production completed successfully!"
            echo "🌐 API: https://api.tarasantoniuk.com"
            echo "📚 Docs: https://api.tarasantoniuk.com/swagger-ui/index.html"
          else
            echo "❌ Deployment failed! Check logs above."
          fi