name: Test Coverage

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests with coverage
        run: mvn clean test

      - name: Generate JaCoCo Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          badges-directory: badges
          generate-branches-badge: true
          generate-summary: true

      - name: Log coverage percentage
        run: |
          echo "Coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "Branches = ${{ steps.jacoco.outputs.branches }}"

      - name: Commit badges to badges branch
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Save badges to temp location
          mkdir -p /tmp/badges-temp
          cp -r badges/* /tmp/badges-temp/ 2>/dev/null || true
          
          # Switch to badges branch (or create it)
          git fetch origin badges 2>/dev/null || true
          git checkout badges 2>/dev/null || git checkout --orphan badges
          
          # Clean everything
          git rm -rf . 2>/dev/null || true
          
          # Copy badges from temp location
          cp -r /tmp/badges-temp/* . 2>/dev/null || true
          
          # Commit if there are changes
          if [[ -n $(git status --porcelain) ]]; then
            git add *.svg *.json
            git commit -m "Update coverage badges [skip ci]"
            git push -f origin badges
            echo "Badges updated successfully"
          else
            echo "No changes to commit"
          fi
          
          # Return to original branch
          git checkout ${{ github.ref_name }}

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/