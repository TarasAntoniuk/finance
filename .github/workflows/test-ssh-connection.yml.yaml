name: Test SSH Connection

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Виводимо змінні для дебагу
      - name: Debug variables
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          echo "Server host length: ${#SERVER_HOST}"
          echo "Server user length: ${#SERVER_USER}"
          echo "Server port: $SERVER_SSH_PORT"

      # 2. Створюємо SSH ключ
      - name: Setup SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/github_deploy_key
          chmod 600 ~/.ssh/github_deploy_key
          ls -la ~/.ssh/

      # 3. Створюємо SSH config файл
      - name: Create SSH config
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          cat > ~/.ssh/config <<EOF
          Host deployserver
            HostName $SERVER_HOST
            User $SERVER_USER
            Port $SERVER_SSH_PORT
            IdentityFile ~/.ssh/github_deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config
          cat ~/.ssh/config

      # 4. Тестове підключення
      - name: Test SSH connection
        run: |
          ssh deployserver "echo '✅ SSH connection successful!' && hostname && whoami && pwd"