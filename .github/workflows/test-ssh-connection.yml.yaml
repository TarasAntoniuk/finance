name: Test SSH Connection (test)

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Виводимо змінні для дебагу (не секретні)
      - name: Debug variables
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          echo "Server host: $SERVER_HOST"
          echo "Server user: $SERVER_USER"
          echo "Server port: $SERVER_SSH_PORT"

      # 2. Декодуємо base64 приватний ключ і даємо права
      - name: Decode SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/github_deploy_key
          chmod 600 ~/.ssh/github_deploy_key

      # 3. Додаємо хост до known_hosts (уникаємо prompt)
      - name: Add host to known_hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          ssh-keyscan -p $SERVER_SSH_PORT $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      # 4. Тестове підключення по SSH
      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
        run: |
          HOST="${SERVER_HOST}"
          USER="${SERVER_USER}"
          PORT="${SERVER_SSH_PORT}"
          
          echo "Connecting to ${USER}@${HOST}:${PORT}..."
          
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/github_deploy_key \
              -p "${PORT}" \
              "${USER}@${HOST}" "echo '✅ SSH connection successful! Hostname:' \$(hostname)"