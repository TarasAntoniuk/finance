version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: finance-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance-core
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d finance-core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-network

  # Spring Boot Application
  app:
    image: eclipse-temurin:21-jre-alpine
    container_name: finance-core-app
    restart: unless-stopped
    working_dir: /app
    command: java -jar -Dspring.profiles.active=prod app.jar

    # Підключаємо env файл
    env_file:
        - .env

      # Інші змінні можна додавати, якщо потрібно
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      SERVER_PORT: 8080
      LOGGING_FILE_PATH: /app/logs
      LOGGING_LEVEL_ROOT: INFO
    volumes:
      - ./app/app.jar:/app/app.jar:ro
      - app_logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - finance-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: finance-core-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - app
    networks:
      - finance-network

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: finance-core-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - finance-network

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local
  certbot_data:
    driver: local
  certbot_webroot:
    driver: local

networks:
  finance-network:
    driver: bridge