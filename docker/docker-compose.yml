services:
  db:
    image: postgres:17-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: finance_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - docker_finance-network

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: finance-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: stable
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/finance_db
      SPRING_DATASOURCE_USERNAME: test_user
      SPRING_DATASOURCE_PASSWORD: test_password
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - docker_finance-network

  nginx:
    image: nginx:alpine
    container_name: finance-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt
      - ./logs/nginx:/var/log/nginx
      - ./webroot:/var/www/certbot
    networks:
      - docker_finance-network

  certbot:
    image: certbot/certbot
    container_name: finance-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew && chown -R 1000:1000 /etc/letsencrypt; sleep 12h & wait $${!}; done;'"
    networks:
      - docker_finance-network

volumes:
  db_data:

networks:
  docker_finance-network:
    external: true