services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: finance-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: stable
      SPRING_DATASOURCE_URL: jdbc:postgresql://shared-postgres:5432/finance
      SPRING_DATASOURCE_USERNAME: finance_user
      SPRING_DATASOURCE_PASSWORD: ${FINANCE_DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--header=Host: localhost", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    external: true
    name: app-network