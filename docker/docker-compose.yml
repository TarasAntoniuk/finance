services:
  finance-core-db:
    image: postgres:17-alpine
    container_name: finance-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  finance-core-app:
    image: eclipse-temurin:21-jre-alpine
    container_name: finance-core-app
    restart: unless-stopped
    depends_on:
      - finance-core-db
    working_dir: /app
    volumes:
      - ./app:/app
    env_file:
      - .env
    command: >
      sh -c "
      echo 'Waiting for DB...' &&
      sleep 10 &&
      java -jar app.jar
      "
    ports:
      - "8080:8080"

  finance-core-nginx:
    image: nginx:alpine
    container_name: finance-core-nginx
    restart: unless-stopped
    depends_on:
      - finance-core-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  finance-core-certbot:
    image: certbot/certbot:latest
    container_name: finance-core-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew; done"

volumes:
  postgres_data:
