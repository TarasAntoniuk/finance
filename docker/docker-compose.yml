version: '3.9'

services:
  finance-core-db:
    image: postgres:17-alpine
    container_name: finance-core-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - finance-db-data:/var/lib/postgresql/data

  finance-core-app:
    build: ./app
    container_name: finance-core-app
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://finance-core-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - finance-core-db
    ports:
      - "8080:8080"

  finance-core-nginx:
    image: nginx:alpine
    container_name: finance-core-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx:/etc/nginx
    depends_on:
      - finance-core-app

  finance-core-certbot:
    image: certbot/certbot:latest
    container_name: finance-core-certbot
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; done"

volumes:
  finance-db-data:
