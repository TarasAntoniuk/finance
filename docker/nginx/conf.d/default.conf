server {
    listen 80;
    server_name api.tarasantoniuk.com;

    # Webroot для certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Перенаправлення всього HTTP на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.tarasantoniuk.com;

    ssl_certificate /etc/letsencrypt/live/api.tarasantoniuk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tarasantoniuk.com/privkey.pem;

    location / {
        proxy_pass http://finance-core-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
