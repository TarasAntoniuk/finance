# HTTP сервер - редірект на HTTPS
server {
    listen 80;
    server_name api.tarasantoniuk.com;

    # Локація для Certbot валідації
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редірект всього іншого трафіку на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    server_name api.tarasantoniuk.com;

    # SSL сертифікати
    ssl_certificate /etc/letsencrypt/live/api.tarasantoniuk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tarasantoniuk.com/privkey.pem;

    # SSL параметри (рекомендовані)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Proxy до Spring додатку
    location / {
        proxy_pass http://finance-core-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}