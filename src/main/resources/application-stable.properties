# suppress inspection "UnusedProperty" for whole file
# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Server Configuration
server.port=8080
# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true
# Swagger UI customization
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
# Package to scan for API endpoints
springdoc.packages-to-scan=com.tarasantoniuk.finance
# Show/hide actuator endpoints in Swagger
springdoc.show-actuator=false
# API Documentation Info
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Access URLs:
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI Docs (JSON): http://localhost:8080/api-docs
# OpenAPI Docs (YAML): http://localhost:8080/api-docs.yaml
server.error.include-stacktrace=never
server.error.include-message=always
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
ecb.sync.enabled=true
ecb.sync.initial-load=false