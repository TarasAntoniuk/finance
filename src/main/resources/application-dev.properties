# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Server Configuration
server.port=8080

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true

# Swagger UI customization
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# Package to scan for API endpoints
springdoc.packages-to-scan=com.example.demo.controller

# Show/hide actuator endpoints in Swagger
springdoc.show-actuator=false

# API Documentation Info
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Group APIs by tags
springdoc.group-configs[0].group=Countries
springdoc.group-configs[0].paths-to-match=/api/countries/**

springdoc.group-configs[1].group=Organizations
springdoc.group-configs[1].paths-to-match=/api/organizations/**

springdoc.group-configs[2].group=Currencies
springdoc.group-configs[2].paths-to-match=/api/currencies/**

springdoc.group-configs[3].group=Accounting Policies
springdoc.group-configs[3].paths-to-match=/api/accounting-policies/**

springdoc.group-configs[4].group=Exchange Rates
springdoc.group-configs[4].paths-to-match=/api/exchange-rates/**

# Access URLs:
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI Docs (JSON): http://localhost:8080/api-docs
# OpenAPI Docs (YAML): http://localhost:8080/api-docs.yaml
