spring.application.name=finance
spring.profiles.active=dev
spring.config.import=optional:classpath:env/env.dev.properties
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.forward-headers-strategy=framework

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000, http://localhost:63342}

app.security.lockout.max-failed-attempts=5
app.security.lockout.lock-duration-minutes=30

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# Google sign-in: ID token is verified against Google's JWKS; no client secret needed
google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.issuer=https://accounts.google.com
google.oauth.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Auto-provisioning for new Google users (role GUEST attached to this organization)
app.provisioning.default-organization-id=1

# Rate limiting
resilience4j.ratelimiter.instances.auth.limitForPeriod=5
resilience4j.ratelimiter.instances.auth.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.auth.timeoutDuration=0s