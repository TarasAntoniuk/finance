# Logging - minimize for tests
logging.level.root=ERROR
logging.level.com.tarasantoniuk.finance=WARN
logging.level.org.testcontainers=WARN
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Disable banner
spring.main.banner-mode=off
# Disable unnecessary features
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
ecb.sync.enabled=false
ecb.sync.initial-load=false
# JWT
app.jwt.secret=test-secret-key-for-jwt-must-be-at-least-32-bytes-long
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000
# Google sign-in
google.oauth.client-id=test-google-client-id.apps.googleusercontent.com
google.oauth.issuer=https://accounts.google.com
google.oauth.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
# Auto-provisioning
app.provisioning.default-organization-id=1
# CORS
app.cors.allowed-origins=http://localhost:3000
# Rate limiting - high limits for tests
resilience4j.ratelimiter.instances.auth.limitForPeriod=1000
resilience4j.ratelimiter.instances.auth.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.auth.timeoutDuration=0s