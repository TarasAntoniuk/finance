# JUnit 5 parallel execution — DISABLED
# Parallel class-level execution is unsafe because:
# 1. Integration tests share a single Testcontainers PostgreSQL database
# 2. @WebMvcTest slice tests share ApplicationContexts with @MockBean,
#    causing Mockito stub leaks between concurrent test classes
# The main performance gains come from reuseForks=true, mapper test
# conversion to unit tests, and cleanup optimization.
junit.jupiter.execution.parallel.enabled=false
